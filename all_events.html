<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Startup</title>
    <link rel="icon" href="icon.ico" />

    <link rel="stylesheet" href="all_events.css" />
    <link rel="stylesheet" href="main.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  </head>
  <body class="bg-light text-dark">
    <header class="container-fluid">
      <nav class="navbar fixed-top navbar-dark bg-primary">
        <a class="navbar-brand" href="#">Thats Whats Up<sup>&reg;</sup></a>
        <menu class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="all_events.html">Events</a></li>
          <li class="nav-item"><a class="nav-link" href="my_events.html">Saved</a></li>
        </menu>
      </nav>
      <hr />
    </header>

    <main class="split">
      <section class="p-4">
        <div class="mb-3">
          <h1>Events:</h1>
          <p>Welcome, <strong class="player-name">playa</strong>!</p>
        </div>
      
        <div class="card">
          <div class="card-body">
            <table class="table table-striped table-hover">
              <thead class="table-primary">
                <tr>
                  <th>Event</th>
                  <th>Date</th>
                  <th># Users attending</th>
                  <th>RSVP</th> 
                </tr>             
              </thead>
              <tbody>
                <tr>
                  <td>
                    <button class="btn btn-link p-0 event-link" type="button">BYU vs Kansas St</button>
                  </td>
                  <td>08/20/2025</td>
                  <td>70,000</td>
                  <td>
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="attendance1" />
                      <label class="form-check-label" for="attendance1">Attending</label>
                    </div>
                  </td>
                </tr>
      
                <tr>
                  <td>
                    <button class="btn btn-link p-0 event-link" type="button">UVU Halloween Dance</button>
                  </td>
                  <td>10/31/2025</td>
                  <td>4</td>
                  <td>
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="attendance2" />
                      <label class="form-check-label" for="attendance2">Attending</label>
                    </div>
                  </td>
                </tr>
      
                <tr>
                  <td>
                    <button class="btn btn-link p-0 event-link" type="button">Aunt Kathy's B-day Party</button>
                  </td>
                  <td>05/06/2025</td>
                  <td>430</td>
                  <td>
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="attendance3" />
                      <label class="form-check-label" for="attendance3">Attending</label>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
      
          

      <!-- Form to submit an event -->
      <section class="p-4">
        <div class="card">
          <div class="card-header bg-primary text-white">
            <h2 class="mb-0">Add an Event</h2>
          </div>
          <div class="card-body">
            <form action="/submit-event" method="POST">
              <div class="mb-3">
                <label for="eventName" class="form-label">Event Name</label>
                <input type="text" class="form-control" id="eventName" name="eventName" required />
              </div>
      
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="eventDate" class="form-label">Date</label>
                  <input type="date" class="form-control" id="eventDate" name="eventDate" required />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="eventTime" class="form-label">Time</label>
                  <input type="time" class="form-control" id="eventTime" name="eventTime" required />
                </div>
              </div>
      
              <div class="mb-3">
                <label for="eventDetails" class="form-label">Details</label>
                <textarea class="form-control" id="eventDetails" name="eventDetails" rows="4" placeholder="Optional notes or description..."></textarea>
              </div>
      
              <div class="d-grid">
                <button type="submit" class="btn btn-primary">Add Event</button>
              </div>
            </form>
          </div>
        </div>
      </section>
      
      
    </main>

    <footer class="bg-primary text-light">
      <div class="container-fluid">
      <span class="text-reset">Dakota Clubb</span>
      <a class="text-center text-light" href="https://github.com/daclubb7916/startup">GitHub</a>
    </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
  </body>
</html>
