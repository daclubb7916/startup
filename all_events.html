<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Startup</title>
    <link rel="icon" href="icon.ico" />

    <link rel="stylesheet" href="all_events.css" />
    <link rel="stylesheet" href="main.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  </head>
  <body class="bg-light text-dark">
    <header class="container-fluid">
      <nav class="navbar fixed-top navbar-dark bg-primary">
        <a class="navbar-brand" href="#">Thats Whats Up<sup>&reg;</sup></a>
        <menu class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="all_events.html">Events</a></li>
          <li class="nav-item"><a class="nav-link" href="my_events.html">Saved</a></li>
        </menu>
      </nav>
      <hr />
    </header>

    <main>
        <section>
          <div class="players">
            Player:
            <span class="player-name">playa</span>
          </div>
            <h1>Events:</h1>
            <table class="events">
              <tr class="header">
                <th>Event</th>
                <th>Date</th>
                <th># Users attending</th>
                <th>RSVP</th> 
              </tr>             
          
              <tr class="row">
                <td>
                    <button class="event-link" type="button">BYU vs Kansas St</button>
                </td>
                <td>08/20/2025</td>
                <td>70,000</td>
                <td>
                  <label for="attendance1">Attending:</label>
                  <input type="checkbox" id="attendance1" name="varCheckbox" value="attendance1" />
                </td>
              </tr>
          
              <tr class="row">
                <td>
                    <button class="event-link" type="button">UVU Halloween Dance</button>
                </td>
                <td>10/31/2025</td>
                <td>4</td>
                <td>
                  <label for="attendance2">Attending:</label>
                  <input type="checkbox" id="attendance2" name="varCheckbox" value="attendance2" />
                </td>
              </tr>
          
              <tr class="row">
                <td>
                    <button class="event-link" type="button">Aunt Kathy's B-day Party</button>
                </td>
                <td>05/06/2025</td>
                <td>430</td>
                <td>
                  <label for="attendance3">Attending:</label>
                  <input type="checkbox" id="attendance3" name="varCheckbox" value="attendance3" />
                </td>
              </tr>
            </table>
          </section>
          

      <!-- Form to submit an event -->
      <section>
        <h2>Add an Event</h2>
        <form action="/submit-event" method="POST">
          <ul>
            <li>
              <label for="eventName">Event Name:</label><br>
              <input type="text" id="eventName" name="eventName" required />
            </li>
      
            <li>
              <label for="eventDate">Date:</label><br>
              <input type="date" id="eventDate" name="eventDate" required />
            </li>
      
            <li>
              <label for="eventTime">Time:</label><br>
              <input type="time" id="eventTime" name="eventTime" required />
            </li>
      
            <li>
              <label for="eventDetails">Details:</label><br>
              <textarea id="eventDetails" name="eventDetails" rows="4" cols="40" placeholder="Optional notes or description..."></textarea>
            </li>
      
            <li>
              <button type="submit">Add Event</button>
            </li>
          </ul>
        </form>
      </section>
      
    </main>

    <footer class="bg-primary text-light">
      <div class="container-fluid">
      <span class="text-reset">Dakota Clubb</span>
      <a class="text-center text-light" href="https://github.com/daclubb7916/startup">GitHub</a>
    </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
  </body>
</html>
