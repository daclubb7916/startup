<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Startup</title>
    <link rel="icon" href="icon.ico" />
  </head>
  <body>
    <!-- Use header, main, and footer elements to give semantic structure -->
    <header>
      <h1>Thats Whats Up<sup>&reg;</sup></h1>

      <!-- Navigation elements -->
      <nav>
        <!-- Menu is a semantic alternative to <ul> that represents an interaction -->
        <menu>
            <li><a href="index.html">Login</a></li>
            <li><a href="all_events.html">Events</a></li>
            <li><a href="my_events.html">Saved</a></li>
        </menu>
      </nav>

      <!-- Since we don't have the ability to style we use old style HTML to give some visual formatting -->
      <hr />
    </header>

    <main>
        <section>
            <h1>Events:</h1>
            <table class="events">
              <tr class="header">
                <th>Event</th>
                <th>Date</th>
                <th># Users attending</th>
                <th>RSVP</th> 
              </tr>             
          
              <tr class="row">
                <td>BYU vs Kansas St</td>
                <td>08/20/2025</td>
                <td>70,000</td>
                <td>
                  <label for="attendance1">Attending:</label>
                  <input type="checkbox" id="attendance1" name="varCheckbox" value="attendance1" />
                </td>
              </tr>
          
              <tr class="row">
                <td>UVU Halloween Dance</td>
                <td>10/31/2025</td>
                <td>4</td>
                <td>
                  <label for="attendance2">Attending:</label>
                  <input type="checkbox" id="attendance2" name="varCheckbox" value="attendance2" />
                </td>
              </tr>
          
              <tr class="row">
                <td>Aunt Kathy's B-day Party</td>
                <td>05/06/2025</td>
                <td>430</td>
                <td>
                  <label for="attendance3">Attending:</label>
                  <input type="checkbox" id="attendance3" name="varCheckbox" value="attendance3" />
                </td>
              </tr>
            </table>
          </section>
          

      <!-- Form to submit an event -->
      <section>
        <h2>Add an Event</h2>
        <form action="/submit-event" method="POST">
          <ul>
            <li>
              <label for="eventName">Event Name:</label><br>
              <input type="text" id="eventName" name="eventName" required />
            </li>
      
            <li>
              <label for="eventDate">Date:</label><br>
              <input type="date" id="eventDate" name="eventDate" required />
            </li>
      
            <li>
              <label for="eventTime">Time:</label><br>
              <input type="time" id="eventTime" name="eventTime" required />
            </li>
      
            <li>
              <label for="eventDetails">Details:</label><br>
              <textarea id="eventDetails" name="eventDetails" rows="4" cols="40" placeholder="Optional notes or description..."></textarea>
            </li>
      
            <li>
              <button type="submit">Add Event</button>
            </li>
          </ul>
        </form>
      </section>
      
    </main>

    <footer>
      <hr />
      <span class="text-reset">Dakota Clubb</span>
      <br />
      <a href="https://github.com/daclubb7916/startup">GitHub</a>
    </footer>
  </body>
</html>
